<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"><link rel="stylesheet" href="../assets/css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Entregas · GiftExpress Admin</title><script>window.GX_BASE=location.pathname.includes('/admin/')?location.pathname.split('/admin/')[0]+'/':location.pathname.substring(0,location.pathname.lastIndexOf('/')+1);if(location.protocol==='file:'){document.addEventListener('DOMContentLoaded',()=>{const b=document.createElement('div');b.style.cssText='position:fixed;inset:0 0 auto;background:#542f2b;color:white;padding:20px;z-index:999999;font:15px Arial';b.innerHTML='Esta aplicación requiere HTTP. Publicala en GitHub Pages o ejecutá INICIAR-GIFTEXPRESS.bat. <button onclick="this.parentNode.remove()">Cerrar</button>';document.body.prepend(b)})}else{const gxFix=()=>{document.querySelectorAll('[href^="/"],[src^="/"]').forEach(x=>{let k=x.hasAttribute('href')?'href':'src',v=x.getAttribute(k);if(v.startsWith('//')||v.startsWith(window.GX_BASE))return;x.setAttribute(k,window.GX_BASE+v.slice(1))})};document.addEventListener('DOMContentLoaded',()=>{gxFix();new MutationObserver(gxFix).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['src','href']})})}</script></head><body class="admin-body" data-page="deliveries"><div class="admin-shell"><aside class="admin-sidebar" data-admin-sidebar></aside><div class="admin-main"><header class="admin-topbar" data-admin-topbar></header><main class="admin-content"><div id="adminError" hidden class="alert-gx alert-error"></div><div class="eyebrow">Logística</div><h1 class="admin-title">Zonas de entrega</h1><div class="admin-grid-2" style="margin-top:18px"><form id="zoneForm" class="admin-form"><h3>Nueva zona</h3><label class="form-group">Nombre<input class="form-control-gx" name="name" required></label><label class="form-group">Barrios (separados por coma)<textarea class="form-control-gx" name="districts"></textarea></label><label class="form-group">Códigos postales (coma)<input class="form-control-gx" name="postal_codes"></label><label class="form-group">Costo ARS<input class="form-control-gx" type="number" name="price_ars"></label><label class="form-group">Gratis desde ARS<input class="form-control-gx" type="number" name="free_over_ars"></label><label class="form-group">Pedido mínimo ARS<input class="form-control-gx" type="number" name="min_order_ars"></label><label class="form-group">Horario límite<input class="form-control-gx" type="time" name="cutoff" value="17:00"></label><label class="form-group">Tiempo estimado<input class="form-control-gx" name="eta" value="2–4 h"></label><button class="btn-gx btn-primary-gx" style="margin-top:14px">Guardar zona</button></form><div class="table-wrap"><table class="table-gx"><thead><tr><th>Zona</th><th>Barrios</th><th>Costo</th><th>Mínimo</th><th>Límite</th><th>ETA</th></tr></thead><tbody id="genericRows"></tbody></table></div></div></main></div></div><script type="module" src="../assets/js/pages/admin.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script>document.addEventListener('error',e=>{if(e.target.tagName==='IMG'&&e.target.src.includes('images.unsplash.com')){e.target.onerror=null;e.target.src=window.GX_BASE+'assets/img/products/caja.svg'}},true)</script></body></html>
