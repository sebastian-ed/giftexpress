<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"><link rel="stylesheet" href="../assets/css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Categorías · GiftExpress Admin</title><script>window.GX_BASE=location.pathname.includes('/admin/')?location.pathname.split('/admin/')[0]+'/':location.pathname.substring(0,location.pathname.lastIndexOf('/')+1);if(location.protocol==='file:'){document.addEventListener('DOMContentLoaded',()=>{const b=document.createElement('div');b.style.cssText='position:fixed;inset:0 0 auto;background:#542f2b;color:white;padding:20px;z-index:999999;font:15px Arial';b.innerHTML='Esta aplicación requiere HTTP. Publicala en GitHub Pages o ejecutá INICIAR-GIFTEXPRESS.bat. <button onclick="this.parentNode.remove()">Cerrar</button>';document.body.prepend(b)})}else{const gxFix=()=>{document.querySelectorAll('[href^="/"],[src^="/"]').forEach(x=>{let k=x.hasAttribute('href')?'href':'src',v=x.getAttribute(k);if(v.startsWith('//')||v.startsWith(window.GX_BASE))return;x.setAttribute(k,window.GX_BASE+v.slice(1))})};document.addEventListener('DOMContentLoaded',()=>{gxFix();new MutationObserver(gxFix).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['src','href']})})}</script></head><body class="admin-body" data-page="categories"><div class="admin-shell"><aside class="admin-sidebar" data-admin-sidebar></aside><div class="admin-main"><header class="admin-topbar" data-admin-topbar></header><main class="admin-content"><div id="adminError" hidden class="alert-gx alert-error"></div><div class="eyebrow">Catálogo</div><h1 class="admin-title">Categorías</h1><div class="admin-grid-2" style="margin-top:18px"><form id="categoryForm" class="admin-form"><h3>Crear / editar</h3><input type="hidden" name="id"><label class="form-group">Nombre ES<input class="form-control-gx" name="name_es" required></label><label class="form-group">Nombre EN<input class="form-control-gx" name="name_en"></label><label class="form-group">Nombre PT<input class="form-control-gx" name="name_pt"></label><label class="form-group">Slug<input class="form-control-gx" name="slug" required></label><label class="form-group">Orden<input class="form-control-gx" type="number" name="sort_order" value="0"></label><button class="btn-gx btn-primary-gx" style="margin-top:14px">Guardar categoría</button></form><div class="table-wrap"><table class="table-gx"><thead><tr><th>Nombre</th><th>Slug</th><th>Orden</th><th>Estado</th><th></th></tr></thead><tbody id="genericRows"></tbody></table></div></div></main></div></div><script type="module" src="../assets/js/pages/admin.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script>document.addEventListener('error',e=>{if(e.target.tagName==='IMG'&&e.target.src.includes('images.unsplash.com')){e.target.onerror=null;e.target.src=window.GX_BASE+'assets/img/products/caja.svg'}},true)</script></body></html>
