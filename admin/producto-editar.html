<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"><link rel="stylesheet" href="../assets/css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Editar producto · GiftExpress Admin</title><script>window.GX_BASE=location.pathname.includes('/admin/')?location.pathname.split('/admin/')[0]+'/':location.pathname.substring(0,location.pathname.lastIndexOf('/')+1);if(location.protocol==='file:'){document.addEventListener('DOMContentLoaded',()=>{const b=document.createElement('div');b.style.cssText='position:fixed;inset:0 0 auto;background:#542f2b;color:white;padding:20px;z-index:999999;font:15px Arial';b.innerHTML='Esta aplicación requiere HTTP. Publicala en GitHub Pages o ejecutá INICIAR-GIFTEXPRESS.bat. <button onclick="this.parentNode.remove()">Cerrar</button>';document.body.prepend(b)})}else{const gxFix=()=>{document.querySelectorAll('[href^="/"],[src^="/"]').forEach(x=>{let k=x.hasAttribute('href')?'href':'src',v=x.getAttribute(k);if(v.startsWith('//')||v.startsWith(window.GX_BASE))return;x.setAttribute(k,window.GX_BASE+v.slice(1))})};document.addEventListener('DOMContentLoaded',()=>{gxFix();new MutationObserver(gxFix).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['src','href']})})}</script></head><body class="admin-body" data-page="product-edit"><div class="admin-shell"><aside class="admin-sidebar" data-admin-sidebar></aside><div class="admin-main"><header class="admin-topbar" data-admin-topbar></header><main class="admin-content"><div id="adminError" hidden class="alert-gx alert-error"></div><div class="eyebrow">Productos</div><h1 class="admin-title">Producto</h1><form id="productForm" class="admin-form" style="margin-top:16px"><h3>Información</h3><div class="form-grid"><label class="form-group">SKU<input class="form-control-gx" name="sku" required></label><label class="form-group">Slug<input class="form-control-gx" id="slug" name="slug" required></label><label class="form-group full">Nombre ES<input class="form-control-gx" name="name_es" required></label><label class="form-group">Nombre EN<input class="form-control-gx" name="name_en"></label><label class="form-group">Nombre PT<input class="form-control-gx" name="name_pt"></label><label class="form-group full">Descripción ES<textarea class="form-control-gx" name="description_es" rows="3"></textarea></label><label class="form-group full">Descripción EN<textarea class="form-control-gx" name="description_en" rows="2"></textarea></label><label class="form-group full">Descripción PT<textarea class="form-control-gx" name="description_pt" rows="2"></textarea></label><label class="form-group">Categoría<select class="form-control-gx" id="category_id" name="category_id"></select></label><label class="form-group">Marca<input class="form-control-gx" name="brand"></label><label class="form-group">Precio ARS<input class="form-control-gx" type="number" min="0" name="price_ars" required></label><label class="form-group">Precio promo ARS<input class="form-control-gx" type="number" min="0" name="promo_price_ars"></label><label class="form-group">Stock<input class="form-control-gx" type="number" min="0" name="stock" required></label><label class="form-group">Stock mínimo<input class="form-control-gx" type="number" min="0" name="min_stock"></label><label><input type="checkbox" name="published"> Publicado</label><label><input type="checkbox" name="featured"> Destacado</label><label><input type="checkbox" name="is_new"> Nuevo</label><label><input type="checkbox" name="best_seller"> Más vendido</label></div><h3 style="margin-top:24px">Fotos</h3><label class="dropzone">Arrastrá/seleccioná imágenes<input id="imageInput" type="file" accept="image/*" multiple style="display:block;margin:12px auto 0"></label><div class="image-list" id="imageList"></div><div class="form-actions"><button type="button" id="previewBtn" class="btn-gx btn-outline-gx">Previsualizar producto</button><button class="btn-gx btn-primary-gx">Guardar</button></div></form><section id="previewPanel" hidden style="margin-top:24px"><div class="admin-toolbar"><h2>Preview</h2><div><button class="btn-quiet" data-device="desktop">Desktop</button> <button class="btn-quiet" data-device="tablet">Tablet</button> <button class="btn-quiet" data-device="mobile">Mobile</button></div></div><div id="previewDevice" class="preview-device desktop"></div></section></main></div></div><script type="module" src="../assets/js/pages/admin.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script>document.addEventListener('error',e=>{if(e.target.tagName==='IMG'&&e.target.src.includes('images.unsplash.com')){e.target.onerror=null;e.target.src=window.GX_BASE+'assets/img/products/caja.svg'}},true)</script></body></html>
