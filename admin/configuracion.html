<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"><link rel="stylesheet" href="../assets/css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Configuración · GiftExpress Admin</title><script>window.GX_BASE=location.pathname.includes('/admin/')?location.pathname.split('/admin/')[0]+'/':location.pathname.substring(0,location.pathname.lastIndexOf('/')+1);if(location.protocol==='file:'){document.addEventListener('DOMContentLoaded',()=>{const b=document.createElement('div');b.style.cssText='position:fixed;inset:0 0 auto;background:#542f2b;color:white;padding:20px;z-index:999999;font:15px Arial';b.innerHTML='Esta aplicación requiere HTTP. Publicala en GitHub Pages o ejecutá INICIAR-GIFTEXPRESS.bat. <button onclick="this.parentNode.remove()">Cerrar</button>';document.body.prepend(b)})}else{const gxFix=()=>{document.querySelectorAll('[href^="/"],[src^="/"]').forEach(x=>{let k=x.hasAttribute('href')?'href':'src',v=x.getAttribute(k);if(v.startsWith('//')||v.startsWith(window.GX_BASE))return;x.setAttribute(k,window.GX_BASE+v.slice(1))})};document.addEventListener('DOMContentLoaded',()=>{gxFix();new MutationObserver(gxFix).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['src','href']})})}</script></head><body class="admin-body" data-page="settings"><div class="admin-shell"><aside class="admin-sidebar" data-admin-sidebar></aside><div class="admin-main"><header class="admin-topbar" data-admin-topbar></header><main class="admin-content"><div id="adminError" hidden class="alert-gx alert-error"></div><div class="eyebrow">Sistema</div><h1 class="admin-title">Configuración</h1><form id="settingsForm" class="admin-form" style="margin-top:18px;max-width:900px"><div class="form-grid"><label class="form-group">Nombre comercial<input class="form-control-gx" name="business_name"></label><label class="form-group">WhatsApp<input class="form-control-gx" name="whatsapp"></label><label class="form-group">Email<input class="form-control-gx" name="email"></label><label class="form-group">Instagram<input class="form-control-gx" name="instagram"></label><label class="form-group">Modo cotizaciones<select class="form-control-gx" name="fx_mode"><option value="manual">Manual</option><option value="api">API</option></select></label><label class="form-group">Moneda de cobro<select class="form-control-gx" name="charge_currency"><option>ARS</option></select></label><label class="form-group">USD / ARS<input class="form-control-gx" name="usd_ars" type="number"></label><label class="form-group">EUR / ARS<input class="form-control-gx" name="eur_ars" type="number"></label><label class="form-group">BRL / ARS<input class="form-control-gx" name="brl_ars" type="number"></label><label class="form-group">Horario límite default<input class="form-control-gx" name="cutoff_default" type="time"></label><label class="form-group full">Texto de entrega<textarea class="form-control-gx" name="default_delivery_text"></textarea></label></div><button class="btn-gx btn-primary-gx" style="margin-top:14px">Guardar configuración</button></form></main></div></div><script type="module" src="../assets/js/pages/admin.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script>document.addEventListener('error',e=>{if(e.target.tagName==='IMG'&&e.target.src.includes('images.unsplash.com')){e.target.onerror=null;e.target.src=window.GX_BASE+'assets/img/products/caja.svg'}},true)</script></body></html>
