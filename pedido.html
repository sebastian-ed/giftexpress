<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f3eb"><link rel="icon" href="./assets/icons/favicon.svg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"><link rel="stylesheet" href="./assets/css/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Seguimiento de pedido · GiftExpress</title><meta name="description" content="GiftExpress · productos argentinos con entrega en hoteles y alojamientos."><meta property="og:title" content="Seguimiento de pedido · GiftExpress"><meta property="og:description" content="GiftExpress · productos argentinos con entrega en hoteles y alojamientos."><meta property="og:type" content="website"><link rel="canonical" href="./pedido.html"><script>window.GX_BASE=location.pathname.includes('/admin/')?location.pathname.split('/admin/')[0]+'/':location.pathname.substring(0,location.pathname.lastIndexOf('/')+1);if(location.protocol==='file:'){document.addEventListener('DOMContentLoaded',()=>{const b=document.createElement('div');b.style.cssText='position:fixed;inset:0 0 auto;background:#542f2b;color:white;padding:20px;z-index:999999;font:15px Arial';b.innerHTML='Esta aplicación requiere HTTP. Publicala en GitHub Pages o ejecutá INICIAR-GIFTEXPRESS.bat. <button onclick="this.parentNode.remove()">Cerrar</button>';document.body.prepend(b)})}else{const gxFix=()=>{document.querySelectorAll('[href^="/"],[src^="/"]').forEach(x=>{let k=x.hasAttribute('href')?'href':'src',v=x.getAttribute(k);if(v.startsWith('//')||v.startsWith(window.GX_BASE))return;x.setAttribute(k,window.GX_BASE+v.slice(1))})};document.addEventListener('DOMContentLoaded',()=>{gxFix();new MutationObserver(gxFix).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['src','href']})})}</script><link rel="stylesheet" href="./assets/css/black-edition.css"></head><body class="gx-black-theme"><div data-gx-header></div><main><section class="section"><div class="container-gx"><div class="eyebrow">Seguimiento</div><h1 class="page-title" style="font-size:clamp(2.4rem,6vw,4rem)">Seguí tu GiftExpress</h1><div id="lookup" class="panel" style="max-width:640px"><form id="trackForm"><label class="form-group">Código de pedido<input class="form-control-gx" id="trackCode" placeholder="GX-1048" required></label><button class="btn-gx btn-primary-gx" style="margin-top:12px">Buscar pedido</button></form><div id="lookupError" hidden class="alert-gx alert-error" style="margin-top:12px"></div></div><div id="orderView" hidden class="checkout-layout"><div class="panel"><div class="eyebrow">Pedido <span id="orderCode"></span></div><h2>¡Listo! Estamos preparando tu GiftExpress.</h2><div class="status-steps" id="steps"></div><h3>Productos</h3><div id="orderItems"></div></div><aside class="panel" style="height:max-content"><h3>Resumen</h3><div class="summary-row"><span>Total</span><strong id="orderTotal"></strong></div><div class="summary-row"><span>Pago</span><strong id="orderPayment"></strong></div><div class="summary-row"><span>Entrega</span><strong id="orderDelivery"></strong></div><p><strong>Destino</strong><br><span id="orderAddress"></span></p></aside></div></div></section></main><div data-gx-footer></div><script type="module" src="./assets/js/app.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="./assets/js/pages/order.js"></script><script>document.addEventListener('error',e=>{if(e.target.tagName==='IMG'&&e.target.src.includes('images.unsplash.com')){e.target.onerror=null;e.target.src=window.GX_BASE+'assets/img/products/caja.svg'}},true)</script></body></html>
