<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"><link rel="stylesheet" href="../assets/css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Ingresar · GiftExpress Admin</title><script>window.GX_BASE=location.pathname.includes('/admin/')?location.pathname.split('/admin/')[0]+'/':location.pathname.substring(0,location.pathname.lastIndexOf('/')+1);if(location.protocol==='file:'){document.addEventListener('DOMContentLoaded',()=>{const b=document.createElement('div');b.style.cssText='position:fixed;inset:0 0 auto;background:#542f2b;color:white;padding:20px;z-index:999999;font:15px Arial';b.innerHTML='Esta aplicación requiere HTTP. Publicala en GitHub Pages o ejecutá INICIAR-GIFTEXPRESS.bat. <button onclick="this.parentNode.remove()">Cerrar</button>';document.body.prepend(b)})}else{const gxFix=()=>{document.querySelectorAll('[href^="/"],[src^="/"]').forEach(x=>{let k=x.hasAttribute('href')?'href':'src',v=x.getAttribute(k);if(v.startsWith('//')||v.startsWith(window.GX_BASE))return;x.setAttribute(k,window.GX_BASE+v.slice(1))})};document.addEventListener('DOMContentLoaded',()=>{gxFix();new MutationObserver(gxFix).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['src','href']})})}</script></head><body class="admin-body"><main class="login-wrap"><section class="login-card"><div class="eyebrow">Administración</div><h1>GiftExpress</h1><p class="muted">Acceso restringido al equipo autorizado.</p><div id="demoHint" class="notice"><strong>Acceso de demostración</strong><div>Usuario: admin@giftexpress.demo<br>Contraseña: demo1234</div><small>Solo funciona en modo demo. En producción se utiliza Supabase Auth.</small></div><div id="loginError" hidden class="alert-gx alert-error"></div><form id="loginForm"><label class="form-group">Email<input class="form-control-gx" type="email" name="email" value="admin@giftexpress.demo" required autocomplete="username"></label><label class="form-group" style="margin-top:12px">Contraseña<input class="form-control-gx" type="password" name="password" value="demo1234" required autocomplete="current-password"></label><button class="btn-gx btn-primary-gx" style="width:100%;margin-top:18px">Ingresar</button></form><p style="margin-top:18px"><a href="../index.html">← Volver a la tienda</a></p></section></main><script type="module" src="../assets/js/pages/admin-login.js"></script><script>document.addEventListener('error',e=>{if(e.target.tagName==='IMG'&&e.target.src.includes('images.unsplash.com')){e.target.onerror=null;e.target.src=window.GX_BASE+'assets/img/products/caja.svg'}},true)</script></body></html>
