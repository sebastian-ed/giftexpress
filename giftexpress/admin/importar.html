<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"><link rel="stylesheet" href="../assets/css/admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Importación de catálogo · GiftExpress Admin</title><script>window.GX_BASE=location.pathname.includes('/admin/')?location.pathname.split('/admin/')[0]+'/':location.pathname.substring(0,location.pathname.lastIndexOf('/')+1);if(location.protocol==='file:'){document.addEventListener('DOMContentLoaded',()=>{const b=document.createElement('div');b.style.cssText='position:fixed;inset:0 0 auto;background:#542f2b;color:white;padding:20px;z-index:999999;font:15px Arial';b.innerHTML='Esta aplicación requiere HTTP. Publicala en GitHub Pages o ejecutá INICIAR-GIFTEXPRESS.bat. <button onclick="this.parentNode.remove()">Cerrar</button>';document.body.prepend(b)})}else{const gxFix=()=>{document.querySelectorAll('[href^="/"],[src^="/"]').forEach(x=>{let k=x.hasAttribute('href')?'href':'src',v=x.getAttribute(k);if(v.startsWith('//')||v.startsWith(window.GX_BASE))return;x.setAttribute(k,window.GX_BASE+v.slice(1))})};document.addEventListener('DOMContentLoaded',()=>{gxFix();new MutationObserver(gxFix).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['src','href']})})}</script></head><body class="admin-body" data-page="imports"><div class="admin-shell"><aside class="admin-sidebar" data-admin-sidebar></aside><div class="admin-main"><header class="admin-topbar" data-admin-topbar></header><main class="admin-content"><div class="eyebrow">Gestión comercial</div><h1 class="admin-title">Importación de catálogo</h1><div id="gxMessage" role="status"></div><section class="panel"><h2>CSV y XLSX</h2><p>Seleccioná un archivo, revisá duplicados y errores antes de confirmar. El importador nunca publica automáticamente registros nuevos.</p><input id="importFile" type="file" accept=".csv,.xlsx,.xls"><div class="admin-toolbar"><button id="downloadTemplate" class="btn-quiet">Descargar plantilla CSV</button><button id="commitImport" class="btn-gx btn-primary-gx" disabled>Importar válidos como borradores</button></div><div id="importSummary"></div><div class="table-wrap"><table class="table-gx"><thead><tr><th>Fila</th><th>SKU</th><th>Nombre</th><th>Estado</th></tr></thead><tbody id="importRows"></tbody></table></div></section></main></div></div><script type="module" src="../assets/js/pages/importer.js"></script><script>document.addEventListener('error',e=>{if(e.target.tagName==='IMG'&&e.target.src.includes('images.unsplash.com')){e.target.onerror=null;e.target.src=window.GX_BASE+'assets/img/products/caja.svg'}},true)</script></body></html>
