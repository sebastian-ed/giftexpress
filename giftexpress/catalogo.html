<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111110"><link rel="icon" href="./assets/icons/favicon.svg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"><link rel="stylesheet" href="./assets/css/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Catálogo · GiftExpress</title><meta name="description" content="GiftExpress · productos argentinos con entrega en hoteles y alojamientos."><meta property="og:title" content="Catálogo · GiftExpress"><meta property="og:description" content="GiftExpress · productos argentinos con entrega en hoteles y alojamientos."><meta property="og:type" content="website"><link rel="canonical" href="./catalogo.html"><script>window.GX_BASE=location.pathname.includes('/admin/')?location.pathname.split('/admin/')[0]+'/':location.pathname.substring(0,location.pathname.lastIndexOf('/')+1);if(location.protocol==='file:'){document.addEventListener('DOMContentLoaded',()=>{const b=document.createElement('div');b.style.cssText='position:fixed;inset:0 0 auto;background:#542f2b;color:white;padding:20px;z-index:999999;font:15px Arial';b.innerHTML='Esta aplicación requiere HTTP. Publicala en GitHub Pages o ejecutá INICIAR-GIFTEXPRESS.bat. <button onclick="this.parentNode.remove()">Cerrar</button>';document.body.prepend(b)})}else{const gxFix=()=>{document.querySelectorAll('[href^="/"],[src^="/"]').forEach(x=>{let k=x.hasAttribute('href')?'href':'src',v=x.getAttribute(k);if(v.startsWith('//')||v.startsWith(window.GX_BASE))return;x.setAttribute(k,window.GX_BASE+v.slice(1))})};document.addEventListener('DOMContentLoaded',()=>{gxFix();new MutationObserver(gxFix).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['src','href']})})}</script><link rel="stylesheet" href="./assets/css/black-edition.css"></head><body class="gx-black-theme"><div data-gx-header></div><main><section class="section"><div class="container-gx"><div class="eyebrow">Catálogo</div><h1 class="page-title" style="font-size:clamp(2.4rem,6vw,4.5rem)">Productos argentinos, sin vueltas.</h1><div class="filters-layout"><aside class="filters"><div class="filter-group"><strong>Categorías</strong><div id="categoryFilters" style="margin-top:10px"></div></div><div class="filter-group"><label><input type="checkbox" id="availability"> Solo disponibles</label></div><div class="filter-group"><strong>Entrega</strong><p class="muted">La cobertura final se valida en checkout según barrio o código postal.</p></div></aside><div><div class="toolbar"><input id="q" class="searchbox" placeholder="Buscar producto, marca o SKU"><span id="resultCount" class="muted"></span><select id="sort" class="select-compact"><option value="featured">Destacados</option><option value="price_asc">Precio menor</option><option value="price_desc">Precio mayor</option><option value="best">Más vendidos</option><option value="new">Nuevos</option></select></div><div class="product-grid" id="catalogGrid"></div></div></div></div></section></main><div data-gx-footer></div><script type="module" src="./assets/js/app.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="./assets/js/pages/catalog.js"></script><script>document.addEventListener('error',e=>{if(e.target.tagName==='IMG'&&e.target.src.includes('images.unsplash.com')){e.target.onerror=null;e.target.src=window.GX_BASE+'assets/img/products/caja.svg'}},true)</script><div id="static-catalog-file" style="display:none;background:#111;color:#eee;padding:50px 5%;font:14px Arial"><h2 style="font-size:28px">Explorá la colección</h2><p>Para filtrar productos y comprar, publicá el sitio en GitHub Pages o ejecutá INICIAR-GIFTEXPRESS.bat.</p><a style="color:#eee" href="./index.html">← Volver al inicio</a></div><script>if(location.protocol==='file:')document.getElementById('static-catalog-file').style.display='block'</script></body></html>
