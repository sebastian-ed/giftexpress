<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111110"><link rel="icon" href="./assets/icons/favicon.svg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"><link rel="stylesheet" href="./assets/css/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Producto · GiftExpress</title><meta name="description" content="GiftExpress · productos argentinos con entrega en hoteles y alojamientos."><meta property="og:title" content="Producto · GiftExpress"><meta property="og:description" content="GiftExpress · productos argentinos con entrega en hoteles y alojamientos."><meta property="og:type" content="website"><link rel="canonical" href="./producto.html"><script>window.GX_BASE=location.pathname.includes('/admin/')?location.pathname.split('/admin/')[0]+'/':location.pathname.substring(0,location.pathname.lastIndexOf('/')+1);if(location.protocol==='file:'){document.addEventListener('DOMContentLoaded',()=>{const b=document.createElement('div');b.style.cssText='position:fixed;inset:0 0 auto;background:#542f2b;color:white;padding:20px;z-index:999999;font:15px Arial';b.innerHTML='Esta aplicación requiere HTTP. Publicala en GitHub Pages o ejecutá INICIAR-GIFTEXPRESS.bat. <button onclick="this.parentNode.remove()">Cerrar</button>';document.body.prepend(b)})}else{const gxFix=()=>{document.querySelectorAll('[href^="/"],[src^="/"]').forEach(x=>{let k=x.hasAttribute('href')?'href':'src',v=x.getAttribute(k);if(v.startsWith('//')||v.startsWith(window.GX_BASE))return;x.setAttribute(k,window.GX_BASE+v.slice(1))})};document.addEventListener('DOMContentLoaded',()=>{gxFix();new MutationObserver(gxFix).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['src','href']})})}</script><link rel="stylesheet" href="./assets/css/black-edition.css"></head><body class="gx-black-theme"><div data-gx-header></div><main><section class="section"><div class="container-gx product-layout"><div><div class="gallery-main"><img id="mainImage" src="./assets/img/products/caja.svg" alt="Producto"></div><div class="thumbs" id="thumbs"></div></div><div class="product-panel"><div class="delivery-pill">● Entrega hoy donde esté disponible</div><h1 id="productName">Producto</h1><div class="price" id="productPrice"></div><p id="productDesc" class="muted"></p><div class="notice" id="currencyNotice" hidden></div><select id="gxVariants" hidden aria-label="Variante" class="form-select" style="max-width:360px;margin-top:16px"></select><div id="gxStory" class="muted"></div><div style="display:flex;gap:10px;align-items:center;margin:18px 0"><div class="quantity"><button id="qtyMinus" aria-label="Restar">−</button><input id="qty" value="1" inputmode="numeric" aria-label="Cantidad"><button id="qtyPlus" aria-label="Sumar">+</button></div><button class="btn-gx btn-primary-gx" id="addCart">Agregar al carrito</button><button class="btn-gx btn-accent" id="buyNow">Comprar ahora</button></div><ul class="info-list"><li><span>SKU</span><strong id="productSku"></strong></li><li><span>Stock</span><strong id="productStock"></strong></li><li><span>Marca</span><strong id="productBrand"></strong></li><li><span>Origen</span><strong id="productOrigin"></strong></li><li><span>Peso / contenido</span><strong id="productWeight"></strong></li></ul><div class="alert-gx">¿Todavía no sabés tu habitación? Podés indicar entrega en recepción a tu nombre durante el checkout.</div></div></div></section><section class="section"><div class="container-gx"><div class="section-head"><h2>También te puede servir</h2></div><div class="product-grid" id="related"></div></div></section></main><div data-gx-footer></div><script type="module" src="./assets/js/app.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="./assets/js/pages/product.js"></script><script>document.addEventListener('error',e=>{if(e.target.tagName==='IMG'&&e.target.src.includes('images.unsplash.com')){e.target.onerror=null;e.target.src=window.GX_BASE+'assets/img/products/caja.svg'}},true)</script></body></html>
